<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Beacon: Your Personal Knowledge Base</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/icon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/assets/icon.ico" />
    <link rel="apple-touch-icon" href="/assets/icon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Hide content until scroll position is restored to prevent visible jump */
      body:not(.scroll-restored) {
        visibility: hidden;
        overflow: hidden;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900 text-slate-50 antialiased">
    <script>
      // Immediately restore scroll position before React renders (prevents visible jump)
      (function() {
        const savedScrollPosition = sessionStorage.getItem('ai_beacon_scroll_position');
        if (savedScrollPosition) {
          const scrollPos = parseInt(savedScrollPosition, 10);
          if (scrollPos > 0) {
            // Set scroll position immediately
            window.scrollTo(0, scrollPos);
            document.documentElement.scrollTop = scrollPos;
            document.body.scrollTop = scrollPos;
            
            // Wait for next frame to ensure scroll position is set, then show content
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                document.body.classList.add('scroll-restored');
              });
            });
          } else {
            // No saved position, show immediately
            document.body.classList.add('scroll-restored');
          }
        } else {
          // No saved position, show immediately
          document.body.classList.add('scroll-restored');
        }
      })();
    </script>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
